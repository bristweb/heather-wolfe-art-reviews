name: Build reviews index

on:
  push:
    branches: [main]
    paths:
      - 'data/reviews/**'
      - '!data/reviews/index.json'
      - '!data/reviews/schema.json'
      - 'data/config.json'
      - 'data/images/reviewers/**'
      - 'scripts/build-index.mjs'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate review files and rebuild data/reviews/index.json + schema.json
        run: node scripts/build-index.mjs
      - name: Commit generated files if they changed
        run: |
          git add -N data/reviews/schema.json 2>/dev/null || true
          if git diff --quiet -- data/reviews/index.json data/reviews/schema.json; then
            echo "data/reviews/index.json and schema.json are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add data/reviews/index.json data/reviews/schema.json
          git commit -m "chore: rebuild data/reviews/index.json and schema.json"
          git push
